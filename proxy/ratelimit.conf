# Rate limiting - throttle automated scanners and brute-force bots
# Included at http{} level by nginx-proxy via conf.d/

# Zones: 10MB shared memory each (~160K unique IPs tracked)
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Apply globally.
#   burst=200 : a single page load of a heavy app (SPA chunks, media segments,
#               API calls, thumbnails) easily fires 60+ requests. Too small a
#               burst throttles legitimate users, not scanners.
#   nodelay   : serve burst requests immediately, don't queue them
limit_req zone=general burst=200 nodelay;

# Max simultaneous connections per IP
limit_conn addr 100;

# Return 429 Too Many Requests (not the default 503)
limit_req_status 429;
limit_conn_status 429;

# Log rate-limited requests as warnings, not errors
limit_req_log_level warn;
